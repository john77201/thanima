version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thanima_web
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8080
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=thanima
      - DB_USERNAME=thanima_user
      - DB_PASSWORD=thanima_secret
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/var/www/html
      - uploads_data:/var/www/html/public/assets/uploads
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: thanima_mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: thanima
      MYSQL_USER: thanima_user
      MYSQL_PASSWORD: thanima_secret
      MYSQL_ROOT_PASSWORD: root_secret_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret_password"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: thanima_phpmyadmin
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root_secret_password
    ports:
      - "8081:80"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  db_data:
  uploads_data:
