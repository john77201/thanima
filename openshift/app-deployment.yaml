apiVersion: apps/v1
kind: Deployment
metadata:
  name: thanima-app
  labels:
    app: thanima-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thanima-app
  template:
    metadata:
      labels:
        app: thanima-app
    spec:
      containers:
      - name: thanima-app
        image: thanima-app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
