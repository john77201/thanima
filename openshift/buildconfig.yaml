apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: thanima-app
  labels:
    app: thanima-app
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: thanima-app
  labels:
    app: thanima-app
spec:
  output:
    to:
      kind: ImageStreamTag
      name: thanima-app:latest
  source:
    type: Git
    git:
      uri: https://github.com/john77201/thanima.git
      ref: master
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  triggers:
  - type: ConfigChange
  - type: ImageChange
